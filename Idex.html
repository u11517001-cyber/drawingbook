<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原住民故事電子繪本 - Interactive Storybook</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wood: {
                            50: '#fdfbf7',
                            100: '#f7f2e8',
                            200: '#eee3d0',
                            300: '#e1cdb0',
                            600: '#966e44',
                            800: '#523a23',
                            900: '#342314',
                        },
                        tribal: {
                            red: '#a8322d',
                            gold: '#d4af37',
                            dark: '#1c1917'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        /* 繪本風格自訂樣式 */
        body {
            background-color: #1a1412;
            background-image: radial-gradient(#342314 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: 'Noto Serif TC', serif;
        }

        /* 3D 繪本翻頁與立體效果 */
        .book-container {
            perspective: 1500px;
        }

        .book-wrapper {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(168, 50, 45, 0.15);
            transition: transform 0.3s ease;
        }

        /* 原民風格幾何圖騰邊框飾條 */
        .tribal-border {
            border: 12px solid #523a23;
            border-image: repeating-linear-gradient(45deg, #a8322d, #a8322d 15px, #d4af37 15px, #d4af37 30px, #342314 30px, #342314 45px) 20;
        }

        /* 圖片切換平滑淡入動畫 */
        .page-image {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #342314;
        }
        ::-webkit-scrollbar-thumb {
            background: #966e44;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4af37;
        }

        /* 按鈕 hover 效果 */
        .btn-hover {
            transition: all 0.2s ease;
        }
        .btn-hover:hover {
            transform: translateY(-2px) scale(1.05);
            filter: brightness(1.15);
        }
        .btn-hover:active {
            transform: translateY(0) scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen text-amber-50 flex flex-col justify-between select-none overflow-x-hidden">

    <!-- 頂部導覽與控制列 -->
    <header class="bg-wood-900/90 backdrop-blur border-b border-wood-600/30 px-4 py-3 sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <!-- 標題與 Spirit 圖示 -->
            <div class="flex items-center space-x-3">
                <img src="graphics/spirit.png" onerror="this.src='https://placehold.co/50x50/a8322d/ffffff?text=Spirit'" alt="Spirit Icon" class="w-10 h-10 object-contain drop-shadow">
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-amber-100 tracking-wide flex items-center gap-2">
                        <span>部落傳承故事繪本</span>
                    </h1>
                    <p class="text-xs text-amber-300/70">Mnanak na qalang - 數位互動繪本</p>
                </div>
            </div>

            <!-- 控制功能區 -->
            <div class="flex items-center space-x-2 md:space-x-4">
                <!-- 背景音樂與配樂控制區 -->
                <div class="flex items-center bg-wood-800/80 px-3 py-1.5 rounded-full border border-wood-600/40 text-xs sm:text-sm gap-2">
                    <button id="bgmToggleBtn" class="text-amber-300 hover:text-white focus:outline-none flex items-center gap-1" title="播放/暫停背景音樂">
                        <i id="bgmIcon" class="fas fa-music"></i>
                    </button>
                    <!-- 音樂模式選擇：頁面專屬配樂 vs 全書伴奏 -->
                    <select id="bgmModeSelect" class="bg-wood-900 border border-wood-600/50 rounded px-1.5 py-0.5 text-xs text-amber-200 focus:outline-none">
                        <option value="page">頁面配樂 (music0~19)</option>
                        <option value="global">全書伴奏 (伴奏.mp3)</option>
                    </select>
                    <input type="range" id="bgmVolume" min="0" max="1" step="0.05" value="0.3" class="w-14 sm:w-16 accent-amber-500 cursor-pointer" title="音樂音量">
                </div>

                <!-- 朗讀音量控制區 -->
                <div class="hidden md:flex items-center bg-wood-800/80 px-3 py-1.5 rounded-full border border-wood-600/40 text-xs sm:text-sm gap-2">
                    <i class="fas fa-headset text-amber-400"></i>
                    <span class="text-xs text-amber-300/80">朗讀</span>
                    <input type="range" id="speechVolume" min="0" max="1" step="0.05" value="0.9" class="w-14 sm:w-16 accent-tribal-red cursor-pointer" title="朗讀音量">
                </div>

                <!-- 自動播放投影片模式 -->
                <button id="slideshowBtn" class="flex items-center space-x-1.5 bg-wood-800/80 hover:bg-wood-600 px-3 py-1.5 rounded-full border border-wood-600/40 text-xs sm:text-sm transition">
                    <i class="fas fa-play text-amber-400"></i>
                    <span id="slideshowText" class="hidden sm:inline">自動朗讀播放</span>
                </button>

                <!-- 故事內文顯示切換 -->
                <button id="toggleTextBtn" class="bg-wood-800/80 hover:bg-wood-600 px-3 py-1.5 rounded-full border border-wood-600/40 text-xs sm:text-sm transition">
                    <i class="fas fa-quote-left text-amber-400 mr-1"></i>
                    <span class="hidden sm:inline">故事文字</span>
                </button>

                <!-- 縮圖選單按鈕 -->
                <button id="openGridBtn" class="bg-tribal-red hover:bg-red-700 text-white px-3.5 py-1.5 rounded-full font-medium text-xs sm:text-sm shadow transition">
                    <i class="fas fa-th-large mr-1"></i>
                    <span>目錄</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要繪本顯示區塊 -->
    <main class="flex-1 flex flex-col items-center justify-center p-2 sm:p-4 md:p-6 my-auto">
        <div class="w-full max-w-5xl">

            <!-- 繪本主體畫框 (木質邊框) -->
            <div class="relative bg-wood-900 p-2 sm:p-4 md:p-6 rounded-2xl border-4 border-wood-600 shadow-2xl book-wrapper">
                
                <!-- 圖像主顯示區域 -->
                <div class="relative aspect-[4/3] md:aspect-[16/10] w-full bg-stone-950 rounded-lg overflow-hidden border-2 border-wood-800 flex items-center justify-center">
                    
                    <!-- 繪本圖片 (預設讀取 graphics/0.jpg ~ 19.jpg) -->
                    <img id="currentPageImg" 
                         src="graphics/0.jpg" 
                         onerror="this.onerror=null; this.src='https://placehold.co/1000x700/2a1a08/f3e5ab?text=Page+' + currentPage;" 
                         alt="繪本頁面" 
                         class="w-full h-full object-contain page-image">

                    <!-- 故事文字覆蓋層 (可開關) -->
                    <div id="textOverlay" class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-4 md:p-6 text-amber-50 transition-all duration-300">
                        <div class="max-w-3xl mx-auto flex items-start gap-3">
                            <i class="fas fa-book-open text-amber-400 text-xl mt-1 shrink-0"></i>
                            <div>
                                <h3 id="storyPageTitle" class="text-amber-400 font-semibold text-sm md:text-base mb-1">第 1 頁 / 共 20 頁</h3>
                                <p id="storyPageText" class="text-sm md:text-lg leading-relaxed font-serif text-stone-100">
                                    載入故事內容中...
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- 語音朗讀動畫提示 -->
                    <div id="speechBadge" class="hidden absolute top-4 right-4 bg-tribal-red/90 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-2 shadow-lg backdrop-blur border border-amber-400/30 animate-pulse">
                        <i class="fas fa-volume-high"></i>
                        <span>語音朗讀中...</span>
                    </div>
                </div>

                <!-- 導覽控制器 (左右箭頭與語音按鈕) -->
                <div class="mt-4 flex items-center justify-between gap-2 px-2">
                    
                    <!-- 上一頁按鈕 (優先使用 graphics/left.jpg) -->
                    <button id="prevBtn" class="btn-hover focus:outline-none group flex items-center gap-2">
                        <img src="graphics/left.jpg" 
                             onerror="this.onerror=null; this.style.display='none'; document.getElementById('prevBtnFallback').classList.remove('hidden');" 
                             alt="上一頁" 
                             class="h-10 sm:h-12 md:h-14 w-auto object-contain rounded shadow">
                        <div id="prevBtnFallback" class="hidden bg-wood-800 hover:bg-wood-600 text-amber-200 px-4 py-2 rounded-lg border border-wood-600 flex items-center gap-2">
                            <i class="fas fa-chevron-left"></i> 上一頁
                        </div>
                    </button>

                    <!-- 中間控制：朗讀按鈕 & 頁碼進度 -->
                    <div class="flex items-center space-x-3 sm:space-x-6">
                        <!-- 朗讀按鈕 (優先使用 graphics/read.jpg) -->
                        <button id="readSpeechBtn" class="btn-hover focus:outline-none flex flex-col items-center group" title="播放語音導覽">
                            <img src="graphics/read.jpg" 
                                 onerror="this.onerror=null; this.style.display='none'; document.getElementById('readBtnFallback').classList.remove('hidden');" 
                                 alt="朗讀" 
                                 class="h-10 sm:h-12 md:h-14 w-auto object-contain rounded shadow">
                            <div id="readBtnFallback" class="hidden bg-tribal-red hover:bg-red-700 text-amber-100 p-3 rounded-full shadow border border-amber-400/40 flex items-center justify-center">
                                <i class="fas fa-volume-high text-xl"></i>
                            </div>
                        </button>

                        <!-- 進度文字 -->
                        <div class="text-center font-sans">
                            <span id="pageIndicator" class="text-lg md:text-xl font-bold text-amber-300">1 / 20</span>
                        </div>
                    </div>

                    <!-- 下一頁按鈕 (優先使用 graphics/right.jpg) -->
                    <button id="nextBtn" class="btn-hover focus:outline-none group flex items-center gap-2">
                        <img src="graphics/right.jpg" 
                             onerror="this.onerror=null; this.style.display='none'; document.getElementById('nextBtnFallback').classList.remove('hidden');" 
                             alt="下一頁" 
                             class="h-10 sm:h-12 md:h-14 w-auto object-contain rounded shadow">
                        <div id="nextBtnFallback" class="hidden bg-wood-800 hover:bg-wood-600 text-amber-200 px-4 py-2 rounded-lg border border-wood-600 flex items-center gap-2">
                            下一頁 <i class="fas fa-chevron-right"></i>
                        </div>
                    </button>

                </div>

                <!-- 頁面快速滑桿 -->
                <div class="mt-4 px-2 flex items-center gap-3">
                    <span class="text-xs text-amber-300/70 font-sans">0</span>
                    <input type="range" id="pageSlider" min="0" max="19" value="0" class="w-full accent-tribal-red cursor-pointer">
                    <span class="text-xs text-amber-300/70 font-sans">19</span>
                </div>

            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-wood-900/60 border-t border-wood-600/30 py-2 text-center text-xs text-amber-200/50">
        <p>鍵盤方向鍵 ← / → 可快速翻頁 | 繪本電子書系統</p>
    </footer>

    <!-- 頁面縮圖跳轉彈出視窗 (Modal) -->
    <div id="gridModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-wood-900 border-2 border-wood-600 w-full max-w-4xl max-h-[85vh] rounded-2xl flex flex-col shadow-2xl">
            <!-- Modal Header -->
            <div class="p-4 border-b border-wood-600/50 flex justify-between items-center bg-wood-800/50 rounded-t-2xl">
                <h2 class="text-lg font-bold text-amber-200 flex items-center gap-2">
                    <i class="fas fa-th-large text-tribal-red"></i> 繪本全頁目錄
                </h2>
                <button id="closeGridBtn" class="text-amber-400 hover:text-white p-1 text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- Grid List -->
            <div class="p-4 overflow-y-auto grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3" id="thumbnailContainer">
                <!-- 由 JavaScript 動態生成 0.jpg ~ 19.jpg 的縮圖卡片 -->
            </div>
        </div>
    </div>

    <!-- 音訊元素 -->
    <audio id="speechAudio" preload="auto"></audio>
    <audio id="bgmAudio" loop preload="auto"></audio>

    <!-- 腳本邏輯 -->
    <script>
        // 預設故事文本 (0 ~ 19 頁)，若您有自訂故事內容可在此修改
        const storyTexts = [
            "【封面】Mnanak na qalang - 故事的開端，讓我們一起探索部落的歷史與傳說。",
            "在很久很久以前，高山森林裡圍繞著濃霧，部落的前輩們在此安居樂業。",
            "夜幕降臨，老人坐在火堆旁，娓娓道來古老的部落故事與訓示。",
            "孩子們聚精會神地聽著，眼中閃爍著對大自然與祖靈的敬畏之情。",
            "穿越密林深處，獵人們遵循著祖靈的智慧，學習與大自然和諧共存。",
            "勇敢的孩子在竹林間穿梭，學習辨識植物與森林中的各種痕跡。",
            "歡樂的節慶來臨，族人們穿上傳統服飾，圍繞在火堆旁歌唱跳舞。",
            "族裡的長老傳授著編織與工藝的技巧，將文化代代相傳。",
            "勇士向年輕一代講述獵場的規則，強調尊重生命與分享的精神。",
            "夕陽餘暉灑落山谷，人們牽著獵犬，感謝大地賜予豐富的物產。",
            "慶典上大家共享豐盛的烤肉與美食，感恩祖靈的庇佑與照顧。",
            "愛與關懷在家族之間流淌，溫暖的手牽起希望的未來。",
            "彩虹橋橫跨山谷之上，傳說中那是通往祖靈淨土的聖潔之路。",
            "年輕人在溪流邊沉思，聆聽水聲與風聲交織出的自然樂章。",
            "當危機來臨時，族人們團結一心，共同守護我們的家園與土地。",
            "飛躍於森林間的山羌與飛鳥，展現出大地蓬勃的生命力。",
            "高聳的樹林裡，每一顆大樹都記錄著歲月的痕跡與部落的故事。",
            "感恩的烤肉大會，族人們將最好的食物分享給鄰舍與親友。",
            "長老的手親切地撫摸孩子的頭，將祖靈的祝福傳遞給下一代。",
            "【完結】這份對土地與文化的愛，將永遠在我們的血脈中流淌傳承。"
        ];

        // 狀態管理
        let currentPage = 0;
        const totalPages = 20; // 0.jpg 至 19.jpg
        let isSlideshowActive = false;
        let isAudioPlaying = false;
        let isBgmPlaying = false;
        let speechTimer = null;
        let bgmMode = 'page'; // 'page' (music0~19.mp3) 或 'global' (伴奏.mp3)

        // DOM 元素
        const currentPageImg = document.getElementById('currentPageImg');
        const storyPageTitle = document.getElementById('storyPageTitle');
        const storyPageText = document.getElementById('storyPageText');
        const pageIndicator = document.getElementById('pageIndicator');
        const pageSlider = document.getElementById('pageSlider');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const readSpeechBtn = document.getElementById('readSpeechBtn');
        const speechAudio = document.getElementById('speechAudio');
        const bgmAudio = document.getElementById('bgmAudio');
        const bgmToggleBtn = document.getElementById('bgmToggleBtn');
        const bgmIcon = document.getElementById('bgmIcon');
        const bgmVolume = document.getElementById('bgmVolume');
        const bgmModeSelect = document.getElementById('bgmModeSelect');
        const speechVolume = document.getElementById('speechVolume');
        const slideshowBtn = document.getElementById('slideshowBtn');
        const slideshowText = document.getElementById('slideshowText');
        const toggleTextBtn = document.getElementById('toggleTextBtn');
        const textOverlay = document.getElementById('textOverlay');
        const speechBadge = document.getElementById('speechBadge');

        // Modal DOM
        const openGridBtn = document.getElementById('openGridBtn');
        const closeGridBtn = document.getElementById('closeGridBtn');
        const gridModal = document.getElementById('gridModal');
        const thumbnailContainer = document.getElementById('thumbnailContainer');

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadPage(0);
            renderThumbnails();
            setupEventListeners();
        });

        // 載入指定頁面
        function loadPage(pageIndex) {
            if (pageIndex < 0 || pageIndex >= totalPages) return;
            
            currentPage = pageIndex;

            // 圖片淡出與更新
            currentPageImg.style.opacity = '0.3';
            currentPageImg.style.transform = 'scale(0.98)';
            
            setTimeout(() => {
                currentPageImg.src = `graphics/${currentPage}.jpg`;
                currentPageImg.style.opacity = '1';
                currentPageImg.style.transform = 'scale(1)';
            }, 150);

            // 更新文字內容與頁碼
            storyPageTitle.textContent = `第 ${currentPage + 1} 頁 / 共 ${totalPages} 頁`;
            storyPageText.textContent = storyTexts[currentPage] || `第 ${currentPage} 頁故事內容`;
            pageIndicator.textContent = `${currentPage + 1} / ${totalPages}`;
            pageSlider.value = currentPage;

            // 更新語音源 (speech/speech0.mp3 ... speech19.mp3)
            speechAudio.src = `speech/speech${currentPage}.mp3`;
            speechAudio.volume = parseFloat(speechVolume.value);
            
            // 更新音樂源
            updateBgmSource();

            // 如果在自動播放模式下，切換頁面後自動播放語音
            if (isSlideshowActive) {
                playSpeech();
            } else {
                stopSpeech();
            }
        }

        // 更新背景音樂/頁面配樂音訊源
        function updateBgmSource() {
            const targetBgmSrc = (bgmMode === 'global') 
                ? 'music/伴奏.mp3' 
                : `music/music${currentPage}.mp3`;

            // 如果當前背景音樂源相同且正在播放中，則不重新加載
            if (bgmAudio.getAttribute('src') !== targetBgmSrc) {
                bgmAudio.src = targetBgmSrc;
                bgmAudio.volume = parseFloat(bgmVolume.value);

                if (isBgmPlaying) {
                    bgmAudio.play().catch(err => {
                        console.warn("當前音樂播放受阻或不存在，嘗試播放預設伴奏:", err);
                        // 若頁面專屬音樂無效，則嘗試備用的全書伴奏
                        if (bgmMode === 'page') {
                            bgmAudio.src = 'music/伴奏.mp3';
                            bgmAudio.play().catch(e => console.log("伴奏播放失敗:", e));
                        }
                    });
                }
            }
        }

        // 播放背景音樂
        function playBgm() {
            bgmAudio.volume = parseFloat(bgmVolume.value);
            bgmAudio.play().then(() => {
                isBgmPlaying = true;
                bgmIcon.className = "fas fa-music text-amber-400";
            }).catch(e => {
                console.log("背景音樂播放嘗試失敗:", e);
                // 嘗試備用全書伴奏
                bgmAudio.src = 'music/伴奏.mp3';
                bgmAudio.play().then(() => {
                    isBgmPlaying = true;
                    bgmIcon.className = "fas fa-music text-amber-400";
                }).catch(err => console.log("無法自動播放背景音樂:", err));
            });
        }

        function pauseBgm() {
            bgmAudio.pause();
            isBgmPlaying = false;
            bgmIcon.className = "fas fa-volume-xmark text-stone-500";
        }

        // 播放語音導覽
        function playSpeech() {
            // 在使用者點擊語音播放時，若背景音樂開啟且尚未播放，可順帶引導啟用背景音樂
            if (!isBgmPlaying && bgmAudio.paused) {
                playBgm();
            }

            speechAudio.play().then(() => {
                isAudioPlaying = true;
                speechBadge.classList.remove('hidden');
            }).catch(err => {
                console.log("語音播放受阻或檔案不存在:", err);
                if (isSlideshowActive) {
                    clearTimeout(speechTimer);
                    speechTimer = setTimeout(() => {
                        nextPage();
                    }, 5000);
                }
            });
        }

        // 停止語音導覽
        function stopSpeech() {
            speechAudio.pause();
            speechAudio.currentTime = 0;
            isAudioPlaying = false;
            speechBadge.classList.add('hidden');
        }

        // 下一頁 / 上一頁
        function nextPage() {
            if (currentPage < totalPages - 1) {
                loadPage(currentPage + 1);
            } else if (isSlideshowActive) {
                toggleSlideshow();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                loadPage(currentPage - 1);
            }
        }

        // 切換自動播放模式
        function toggleSlideshow() {
            isSlideshowActive = !isSlideshowActive;
            if (isSlideshowActive) {
                slideshowBtn.classList.add('bg-tribal-red', 'text-white');
                slideshowText.textContent = "停止自動播放";
                playSpeech();
            } else {
                slideshowBtn.classList.remove('bg-tribal-red', 'text-white');
                slideshowText.textContent = "自動朗讀播放";
                stopSpeech();
                clearTimeout(speechTimer);
            }
        }

        // 生成目錄縮圖
        function renderThumbnails() {
            thumbnailContainer.innerHTML = '';
            for (let i = 0; i < totalPages; i++) {
                const card = document.createElement('div');
                card.className = `relative cursor-pointer rounded-lg overflow-hidden border-2 transition transform hover:scale-105 ${i === currentPage ? 'border-tribal-gold ring-2 ring-tribal-gold/50' : 'border-wood-600/50 hover:border-amber-400'}`;
                
                card.innerHTML = `
                    <div class="aspect-[4/3] bg-stone-900">
                        <img src="graphics/${i}.jpg" 
                             onerror="this.onerror=null; this.src='https://placehold.co/300x200/2a1a08/f3e5ab?text=Page+${i}';" 
                             alt="頁面 ${i}" 
                             class="w-full h-full object-cover">
                    </div>
                    <div class="bg-wood-900/90 text-center py-1 text-xs text-amber-200 font-sans font-medium">
                        第 ${i + 1} 頁
                    </div>
                `;

                card.addEventListener('click', () => {
                    loadPage(i);
                    gridModal.classList.add('hidden');
                });

                thumbnailContainer.appendChild(card);
            }
        }

        // 事件監聽綁定
        function setupEventListeners() {
            // 按鈕翻頁
            prevBtn.addEventListener('click', prevPage);
            nextBtn.addEventListener('click', nextPage);

            // 手動播放語音按鈕
            readSpeechBtn.addEventListener('click', () => {
                if (isAudioPlaying) {
                    stopSpeech();
                } else {
                    playSpeech();
                }
            });

            // 語音播放結束後處理
            speechAudio.addEventListener('ended', () => {
                isAudioPlaying = false;
                speechBadge.classList.add('hidden');
                if (isSlideshowActive) {
                    setTimeout(nextPage, 1000);
                }
            });

            // 快速進度條
            pageSlider.addEventListener('input', (e) => {
                loadPage(parseInt(e.target.value));
            });

            // 背景音樂開關按鈕
            bgmToggleBtn.addEventListener('click', () => {
                if (isBgmPlaying) {
                    pauseBgm();
                } else {
                    playBgm();
                }
            });

            // 音樂模式選擇 (頁面配樂 vs 全書伴奏)
            bgmModeSelect.addEventListener('change', (e) => {
                bgmMode = e.target.value;
                updateBgmSource();
                if (!isBgmPlaying) {
                    playBgm();
                }
            });

            // 音量控制
            bgmVolume.addEventListener('input', (e) => {
                bgmAudio.volume = e.target.value;
            });
            speechVolume.addEventListener('input', (e) => {
                speechAudio.volume = e.target.value;
            });

            // 自動播放按鈕
            slideshowBtn.addEventListener('click', toggleSlideshow);

            // 文字顯示隱藏切換
            toggleTextBtn.addEventListener('click', () => {
                textOverlay.classList.toggle('hidden');
            });

            // 縮圖 Modal 開關
            openGridBtn.addEventListener('click', () => {
                renderThumbnails();
                gridModal.classList.remove('hidden');
            });
            closeGridBtn.addEventListener('click', () => {
                gridModal.classList.add('hidden');
            });
            gridModal.addEventListener('click', (e) => {
                if (e.target === gridModal) gridModal.classList.add('hidden');
            });

            // 鍵盤左右方向鍵控制
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    prevPage();
                } else if (e.key === 'ArrowRight') {
                    nextPage();
                } else if (e.key === ' ') {
                    e.preventDefault();
                    readSpeechBtn.click();
                }
            });
        }
    </script>
</body>
</html>
